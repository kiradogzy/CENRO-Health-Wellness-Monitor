{% extends 'base.html' %}

{% block title %}Edit Record{% endblock %}
{% block page_title %}Edit Health Record{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px; color: var(--denr-green-dark); font-size: 1.5rem;">Update Details for {{ record.first_name }} {{ record.last_name }}</h2>
    
    <form action="{{ url_for('edit_record', id=record.id) }}" method="POST">
        <div class="form-group">
            <label class="form-label">Date of Checkup</label>
            <div style="display: flex; gap: 8px;">
                <input type="date" id="edit_record_date" name="record_date" class="form-control" value="{{ record.record_date }}" style="flex: 1;">
                <button type="button" class="btn" style="background-color: #E8F5E9; color: var(--denr-green-dark); font-weight: 600; padding: 0 16px;" onclick="document.getElementById('edit_record_date').valueAsDate = new Date();">
                    <i class="fa-regular fa-calendar-check" style="margin-right: 4px;"></i> Today
                </button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label class="form-label">Systolic BP (mmHg)</label>
                <input type="number" name="bp_systolic" class="form-control" value="{{ record.bp_systolic }}">
            </div>
            <div class="form-group">
                <label class="form-label">Diastolic BP (mmHg)</label>
                <input type="number" name="bp_diastolic" class="form-control" value="{{ record.bp_diastolic }}">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Blood Sugar Level (mg/dL)</label>
            <input type="number" step="0.1" name="sugar_level" class="form-control" value="{{ record.sugar_level }}">
        </div>

        <div class="form-group">
            <label class="form-label">Notes / Remarks</label>
            <textarea name="notes" class="form-control" rows="3" oninput="this.value = this.value.replace(/[^\x00-\x7FñÑ]/g, '')">{{ record.notes if record.notes else '' }}</textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">
                <i class="fa-solid fa-save"></i> Save Changes
            </button>
            <a href="{{ url_for('records') }}" class="btn btn-cancel" style="flex: 1;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
